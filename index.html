function profile(){const univs=[...new Set(UNIVERSITY_DATA.map(x=>x.university))].sort();shell(`<main class="wrap"><section class="hero"><div class="eyebrow">STEP 2</div><h1>학과 & 세부 전공 & 대학</h1><p>희망 진로를 입력하면 관련 학과와 대학별 권장과목을 확인할 수 있습니다.</p></section><div class="card"><div class="form-grid"><div class="field"><label>희망 진로</label><input id="career" value="${esc(state.career)}" placeholder="예: 기계공학, 프로그래머, 로봇공학"></div><div class="field"><label>계열</label><select id="major"><option value="">계열 선택</option>${majors.map(x=>`<option ${state.major===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>세부 전공</label><select id="submajor"><option value="">세부 전공 미정</option></select></div><div class="field"><label>희망 대학</label><select id="university"><option value="">대학 미정</option>${univs.map(x=>`<option ${state.university===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>희망 모집단위 / 학과</label><select id="unit"><option value="">학과·모집단위 미정</option></select></div></div><div id="preview" style="margin-top:20px"></div><div class="actions"><button class="secondary" onclick="start()">← 이전</button><button class="primary" onclick="goHome()">설정 완료 →</button></div></div></main>`,'2 / 2 · 진로 설정');

function fillSub(){let el=document.getElementById('submajor');if(!el)return;let list=[];for(const [k,v] of Object.entries(careerMap)){if((state.career||'').includes(k)||state.major==='공학'&&['기계공학','전기·전자공학','컴퓨터·소프트웨어','로봇공학','화학공학','건축·토목'].includes(k))list.push(...v)}list=[...new Set(list)];el.innerHTML='<option value="">세부 전공 미정</option>'+list.map(x=>`<option ${state.submajor===x?'selected':''}>${x}</option>`).join('');}

function updatePreview(){const p=document.getElementById('preview');if(!p)return;let arr=UNIVERSITY_DATA.filter(x=>state.university?x.university===state.university:true);if(state.unit)arr=arr.filter(x=>x.unit===state.unit);else if(state.career)arr=arr.filter(x=>/기계|전기|전자|컴퓨터|소프트웨어|로봇|메카트로닉|공학/.test(x.unit));arr=arr.slice(0,3);p.innerHTML=arr.length?`<div class="notice"><b>자료에서 확인되는 권장과목 미리보기</b><div class="chips" style="margin-top:9px">${arr.flatMap(x=>(x.core+', '+x.recommended).split(/[,，]/)).map(x=>x.trim()).filter(x=>x&&x!=='-').slice(0,14).map(x=>`<span class="chip core">${esc(x)}</span>`).join('')}</div></div>`:'<div class="notice">대학·학과를 선택하면 해당 모집단위의 자료를 표시합니다.</div>';}

function home(){let selected=UNIVERSITY_DATA.filter(x=>(state.university?x.university===state.university:true)&&(state.unit?x.unit===state.unit:true));if(!selected.length&&state.career)selected=UNIVERSITY_DATA.filter(x=>/기계|전기|전자|컴퓨터|소프트웨어|로봇|메카트로닉|공학/.test(x.unit)).slice(0,6);let courses=selected.flatMap(x=>[...String(x.core||'').split(/[,\n]/),...String(x.recommended||'').split(/[,\n]/)]).map(s=>s.replace(/^[-\s]+/,'').trim()).filter(s=>s&&s!=='-'&&!s.includes('과목 위계를')).filter((s,i,a)=>a.indexOf(s)===i).slice(0,14);shell(`<main class="wrap"><div class="home-head"><div><div class="eyebrow">MAIN HOME</div><h2>${esc(state.grade)}학년 진로 설계</h2><div class="muted">${esc(state.career||'희망 진로 미정')} · ${esc(state.submajor||state.major||'계열 미정')} · ${esc(state.university||'대학 미정')}</div></div><button class="primary" onclick="planner()">스터디 플래너 ⏱</button></div><div class="home-grid"><section class="card"><div class="section-title">추천 선택과목</div><div class="recommend"><div class="box"><b>대학별 핵심과목</b><div class="chips" style="margin-top:10px">${courses.slice(0,7).map(x=>`<span class="chip core">${esc(x)}</span>`).join('')||'<span class="muted">대학을 선택하면 표시됩니다.</span>'}</div></div><div class="box"><b>권장과목</b><div class="chips" style="margin-top:10px">${courses.slice(7,14).map(x=>`<span class="chip rec">${esc(x)}</span>`).join('')||'<span class="muted">자료에 제시된 권장과목이 없습니다.</span>'}</div></div></div><p class="footer-note">이 화면의 대학별 과목은 업로드된 2028학년도 대학별 권장과목 자료를 그대로 연결한 것입니다. 2022 개정 교육과정 안내서의 관련 선택과목은 대학의 공식 권장과목과 별개의 참고 예시로 취급합니다.</p></section><section class="card"><div class="section-title">내 진로 정보</div><div class="profile"><div class="avatar">${esc((state.career||'진')[0])}</div><div><b>${esc(state.career||'희망 진로를 설정해 주세요')}</b><div class="muted">${esc(state.unit||'학과·모집단위 미정')}</div></div></div><hr style="border:0;border-top:1px solid #edf0f5;margin:20px 0"><div class="section-title">연결된 대학</div><div class="univ-list">${selected.slice(0,8).map(x=>`<div class="univ"><strong>${esc(x.university)} · ${esc(x.unit)}</strong><small>${esc(x.region)} · ${esc(x.area)}</small></div>`).join('')||'<div class="empty">대학을 선택해 보세요.</div>'}</div></section></div><div class="card" style="margin-top:18px"><div class="section-title">교육과정 참고</div><div class="chips">${Object.entries(CURRICULUM).flatMap(([g,d])=>Object.values(d).flat()).filter((x,i,a)=>a.indexOf(x)===i).slice(0,30).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><p class="footer-note">2022 개정 교육과정 선택과목 안내서에 제시된 보통교과 선택과목을 기반으로 한 목록입니다.</p></div></main>`,'진로·학업 설계');}
let timer=null;function planner(){shell(`<main class="wrap"><div class="home-head"><div><div class="eyebrow">STUDY PLANNER</div><h2>나만의 학습 관리</h2><div class="muted">과목을 추가하고 공부 시간을 측정해 보세요.</div></div><button class="secondary" onclick="home()">← 홈</button></div><div class="home-grid"><section class="card"><div class="section-title">공부 시간 측정</div><div class="timer"><div class="time" id="time">${fmt(state.studySeconds)}</div><div class="timer-controls"><button class="primary" onclick="startTimer()">시작</button><button class="secondary" onclick="pauseTimer()">일시정지</button><button class="secondary" onclick="resetTimer()">초기화</button></div></div></section><section class="card"><div class="section-title">과목 추가</div><div class="planner-row"><input id="taskInput" placeholder="예: 미적분Ⅰ 문제풀이" class="field" style="padding:12px;border:1px solid #dfe4ed;border-radius:12px"><button class="primary" onclick="addTask()">추가</button></div><div id="tasks">${renderTasks()}</div></section></div></main>`,'스터디 플래너');}
function fmt(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function startTimer(){if(timer)return;timer=setInterval(()=>{state.studySeconds++;save();let el=document.getElementById('time');if(el)el.textContent=fmt(state.studySeconds);},1000)}function pauseTimer(){clearInterval(timer);timer=null}function resetTimer(){pauseTimer();state.studySeconds=0;save();planner()}
function addTask(){let el=document.getElementById('taskInput'),v=el.value.trim();if(!v)return;state.tasks.push({id:Date.now(),text:v,done:false});save();document.getElementById('tasks').innerHTML=renderTasks();el.value=''}
function renderTasks(){return state.tasks.length?state.tasks.map(t=>`<div class="task"><label><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"> ${esc(t.text)}</label><button class="secondary small" onclick="removeTask(${t.id})">삭제</button></div>`).join(''):'<div class="empty">아직 추가한 과목이 없습니다.</div>'}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();planner()}function removeTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();planner()}

home=function(){let selected=UNIVERSITY_DATA.filter(x=>(state.university?x.university===state.university:true)&&(state.unit?x.unit===state.unit:true));if(!selected.length&&state.career)selected=UNIVERSITY_DATA.filter(x=>/기계|전기|전자|컴퓨터|소프트웨어|로봇|메카트로닉|공학/.test(x.unit)).slice(0,6);let courses=selected.flatMap(x=>[...String(x.core||'').split(/[，,\n]/),...String(x.recommended||'').split(/[，,\n]/)]).map(x=>x.replace(/^[-\s]+/,'').trim()).filter((x,i,a)=>x&&x!=='-'&&a.indexOf(x)===i).slice(0,14);shell(`<main class="wrap"><div class="home-head"><div><div class="eyebrow">MAIN HOME</div><h2>${esc(state.grade||'미정')}학년 진로 설계</h2><div class="muted">${esc(state.career||'희망 진로 미정')} · ${esc(state.submajor||state.major||'계열 미정')} · ${esc(state.university||'대학 미정')}</div></div><div class="btnrow"><button class="secondary" onclick="profile()">진로 정보 수정</button><button class="primary" onclick="planner()">스터디 플래너 ⏱</button></div></div><div class="home-grid"><section class="card"><div class="section-title">추천 선택과목</div><div class="chips">${courses.map(x=>`<span class="chip core">${esc(x)}</span>`).join('')||'<span class="muted">목표 학과를 설정하면 관련 자료를 볼 수 있어요.</span>'}</div><p class="muted-note">대학별 권장과목 자료는 참고용입니다. 실제 지원 전에는 대학의 최신 모집요강과 학교의 개설 과목을 확인하세요.</p></section><section class="card"><div class="section-title">내 진로 정보</div><p><b>${esc(state.career||'희망 진로 미정')}</b></p><p class="muted">${esc(state.unit||'학과 미정')} · ${esc(state.university||'대학 미정')}</p><div class="btnrow"><button class="secondary" onclick="savedPage()">저장 정보 보기</button><button class="secondary" onclick="roadmapPage()">로드맵 보기</button></div></section></div><h3 style="margin-top:28px">진로 설계 도구</h3>${navButtons()}</main>`,'진로·학업 설계')};
function pageShell(title,subtitle,body){shell(`<main class="wrap"><div class="page-head"><div><div class="eyebrow">CAREER TOOLKIT</div><h2>${title}</h2><div class="muted">${subtitle}</div></div><button class="secondary" onclick="home()">← 홈</button></div>${body}</main>`,'진로 설계 도구')}
function interestPage(){pageShell('관심 분야 선택 및 분석','관심 분야를 고르면 관심 계열 선택으로 넘어갑니다.',`<section class="card"><p>관심 분야를 하나 선택하세요. 아직 모르겠다면 ‘미정’을 선택하고 적성 테스트로 이동할 수 있습니다.</p><div class="pillrow">${interestOptions.map(o=>`<button class="pillbtn ${state.interest===o.name?'active':''}" onclick="chooseInterest('${o.name}')">${o.name}</button>`).join('')}<button class="pillbtn ${state.interest==='미정'?'active':''}" onclick="chooseInterest('미정')">미정</button></div><div id="interestResult">${state.interest==='미정'?interestResultHTML('미정'):''}</div></section>`)}
function interestResultHTML(name){if(name==='미정')return `<div class="resultbox"><b>아직 관심 분야가 정해지지 않았어요.</b><p>진로·적성 테스트를 진행하면 답변 경향을 바탕으로 계열을 살펴볼 수 있습니다.</p><button class="primary" onclick="quizPage()">적성 테스트 시작</button></div>`;let o=interestOptions.find(x=>x.name===name);if(!o)return '';let rows=UNIVERSITY_DATA.filter(x=>new RegExp(o.units.map(escRegex).join('|'),'i').test(x.unit)).slice(0,5);return `<div class="resultbox"><h3>${o.name} 계열</h3><p>${o.desc}</p><b>관련 직업 예시</b><div class="chips">${o.jobs.map(x=>`<span class="chip">${x}</span>`).join('')}</div><b style="display:block;margin-top:14px">관련 학과 예시</b><div class="chips">${o.units.map(x=>`<span class="chip rec">${x}</span>`).join('')}</div><b style="display:block;margin-top:14px">업로드된 대학 권장과목 자료에서 찾은 관련 모집단위</b>${rows.length?rows.map(x=>`<div class="saved-item"><b>${esc(x.university)} · ${esc(x.unit)}</b><div class="muted">핵심: ${esc(x.core||'자료에 별도 표기 없음')}</div></div>`).join(''):'<p class="muted">현재 자료에서 바로 연결되는 모집단위를 찾지 못했습니다. 학과명으로 다시 검색해 보세요.</p>'}<div class="btnrow"><button class="primary" onclick="saveInterest('${name}')">이 분야 저장</button><button class="secondary" onclick="deptPage('${o.units[0]}')">관련 학과 탐색</button></div></div>`}
function escRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

 '인문':[['국어국문학','국어국문'],['영어영문학','영어영문'],['철학','철학'],['사학','국사']],

function quizPage(){let saved=state.quizAnswers||{};pageShell('진로·적성 테스트','정답이 있는 시험이 아니라 관심 경향을 알아보는 간단한 자기 점검입니다.',`<section class="card"><p>각 문항에서 나와 가장 가까운 정도를 선택하세요.</p>${quizQuestions.map((q,i)=>`<div class="saved-item"><b>${i+1}. ${q[0]}</b><div class="pillrow" style="margin-top:8px">${[['전혀 아니다',0],['조금 아니다',1],['보통',2],['그렇다',3]].map(([label,val])=>`<button class="pillbtn ${saved[i]===val?'active':''}" onclick="setQuiz(${i},${val})">${label}</button>`).join('')}</div></div>`).join('')}<div class="btnrow"><button class="primary" onclick="quizResult()">결과 분석</button><button class="secondary" onclick="state.quizAnswers={};save();quizPage()">초기화</button></div><div id="quizResult" class="resultbox">${state.quizResult||'문항에 답한 뒤 결과 분석을 눌러 주세요.'}</div></section>`)}
function setQuiz(i,v){state.quizAnswers=state.quizAnswers||{};state.quizAnswers[i]=v;save();quizPage()}
function quizResult(){let scores={};quizQuestions.forEach((q,i)=>{scores[q[1]]=(scores[q[1]]||0)+(state.quizAnswers?.[i]||0)});let rank=Object.entries(scores).sort((a,b)=>b[1]-a[1]);let top=rank.slice(0,3);let html=`<h3>관심 경향</h3>${top.map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="barbg"><div class="barfill" style="width:${v/9*100}%"></div></div><b>${v}</b></div>`).join('')}<p class="muted-note">이 결과는 간단한 자기 점검이며 전문적인 심리검사나 진로 판정이 아닙니다. 실제 선택은 수업 경험, 활동, 상담 등을 함께 고려하세요.</p><b>추천 학과 예시</b><div class="chips">${top.flatMap(([k])=>interestOptions.find(o=>o.name===k)?.units||[]).filter((x,i,a)=>a.indexOf(x)===i).slice(0,12).map(x=>`<span class="chip rec">${x}</span>`).join('')}</div><button class="primary" onclick="saveQuizResult()">결과 저장</button>`;state.quizResult=html;state.quizScores=scores;save();let el=document.getElementById('quizResult');if(el)el.innerHTML=html}

function deptPage(prefill=''){pageShell('학과 탐색','학과명을 검색해 배우는 내용, 직업, 관련 과목과 비슷한 학과를 살펴보세요.',`<section class="card"><div class="planner-row"><input id="deptSearch" class="field" style="padding:12px;border:1px solid #dfe4ed;border-radius:12px;flex:1" value="${esc(prefill||state.deptSearch||'')}" placeholder="예: 기계공학, 컴퓨터공학, 간호학"><button class="primary" onclick="searchDept()">검색</button></div><div id="deptResults"></div><h3 style="margin-top:18px">저장한 관심 학과</h3><div>${(state.savedDepts||[]).map(d=>`<div class="saved-item">${esc(d)} <button class="secondary small" onclick="deptPage('${esc(d)}')">보기</button></div>`).join('')||'<p class="muted">아직 저장한 학과가 없습니다.</p>'}</div></section>`);searchDept()}
function searchDept(){let el=document.getElementById('deptSearch');if(!el)return;let q=el.value.trim();state.deptSearch=q;save();let known=Object.keys(deptInfo).concat([...new Set(UNIVERSITY_DATA.map(x=>x.unit))]);let matches=known.filter((x,i,a)=>a.indexOf(x)===i&&(!q||x.toLowerCase().includes(q.toLowerCase()))).slice(0,12);let out=document.getElementById('deptResults');out.innerHTML=matches.length?matches.map(d=>{let info=deptInfo[d]||defaultDept;let similar=known.filter(x=>x!==d&&(/공학|학과|로봇|전자|기계/.test(x))&& (d.includes('공학')&&x.includes('공학')||d.includes('학과')&&x.includes('학과'))).slice(0,3);return `<div class="resultbox"><h3>${esc(d)}</h3><p><b>관련 직업:</b> ${esc(info[0])}</p><p><b>배우는 내용:</b> ${esc(info[1])}</p><p><b>관련 과목 참고:</b> ${esc(info[2])}</p><p><b>비슷한 학과:</b> ${similar.map(esc).join(' · ')||'대학별 전공 안내에서 유사 학과를 확인하세요.'}</p><button class="primary" onclick="saveDept('${esc(d)}')">관심 학과 저장</button></div>`}).join(''):'<div class="resultbox">검색 결과가 없습니다. 학과명의 일부를 입력해 보세요.</div>'}
function saveDept(d){state.savedDepts=state.savedDepts||[];if(!state.savedDepts.includes(d))state.savedDepts.push(d);save();deptPage(d)}
function comparePage(){let univs=[...new Set(UNIVERSITY_DATA.map(x=>x.university))].sort();let chosen=state.compareItems||[];pageShell('대학·학과 비교','원하는 만큼 모집단위를 추가해 권장과목과 지역 정보를 비교하세요.',`<section class="card"><p class="muted">대학 선택 후 학과를 선택하고 비교 목록에 추가하세요.</p><div class="form-grid"><div class="field"><label>대학</label><select id="cmpUniv" onchange="fillCompareUnits()"><option value="">대학 선택</option>${univs.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>학과·모집단위</label><select id="cmpUnit"><option value="">대학을 먼저 선택</option></select></div></div><div class="btnrow"><button class="primary" onclick="addCompare()">비교 목록에 추가</button><button class="secondary" onclick="state.compareItems=[];save();comparePage()">비우기</button></div><div id="compareResults">${compareHTML()}</div></section>`)}

function addCompare(){let u=document.getElementById('cmpUniv')?.value,unit=document.getElementById('cmpUnit')?.value;if(!u||!unit)return;state.compareItems=state.compareItems||[];if(!state.compareItems.some(x=>x.university===u&&x.unit===unit))state.compareItems.push({university:u,unit});save();let el=document.getElementById('compareResults');if(el)el.innerHTML=compareHTML()}
function compareHTML(){let items=state.compareItems||[];if(!items.length)return '<p class="muted" style="margin-top:18px">비교할 대학·학과를 추가해 주세요.</p>';return `<div style="overflow:auto;margin-top:18px"><table class="data-table"><thead><tr><th>항목</th>${items.map(x=>`<th>${esc(x.university)}<br>${esc(x.unit)}<br><button class="secondary small" onclick="removeCompare('${esc(x.university)}','${esc(x.unit)}')">제외</button></th>`).join('')}</tr></thead><tbody>${[['지역',x=>x?.region+' · '+x?.area],['핵심 권장과목',x=>x?.core||'자료에 별도 표기 없음'],['권장과목',x=>x?.recommended||'자료에 별도 표기 없음'],['비고',x=>x?.note||'별도 비고 없음']].map(([label,fn])=>`<tr><th>${label}</th>${items.map(i=>{let d=UNIVERSITY_DATA.find(x=>x.university===i.university&&x.unit===i.unit);return `<td>${esc(fn(d))}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="muted-note">비교 내용은 업로드된 대학별 권장과목 자료 기준이며, 대학의 최신 입학전형을 보장하지 않습니다.</p>`}
function removeCompare(u,d){state.compareItems=(state.compareItems||[]).filter(x=>x.university!==u||x.unit!==d);save();comparePage()}
function goalPage(){let univs=[...new Set(UNIVERSITY_DATA.map(x=>x.university))].sort();let units=[...new Set(UNIVERSITY_DATA.filter(x=>!state.goalUniv||x.university===state.goalUniv).map(x=>x.unit))].sort();pageShell('목표 대학 설정','목표 학과의 권장과목과 내가 선택했거나 수강 계획인 과목을 비교합니다.',`<section class="card"><div class="form-grid"><div class="field"><label>목표 대학</label><select id="goalUniv" onchange="state.goalUniv=this.value;state.goalUnit='';save();goalPage()"><option value="">대학 미정</option>${univs.map(x=>`<option value="${esc(x)}" ${state.goalUniv===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>목표 학과</label><select id="goalUnit"><option value="">학과 미정</option>${units.map(x=>`<option value="${esc(x)}" ${state.goalUnit===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field full"><label>현재 선택했거나 수강 계획인 과목 (쉼표로 구분)</label><textarea id="myCourses" rows="3" placeholder="예: 대수, 미적분Ⅰ, 물리학, 정보">${esc((state.myCourses||[]).join(', '))}</textarea></div></div><div class="btnrow"><button class="primary" onclick="saveGoal()">목표 저장 및 과목 비교</button></div><div id="goalResult">${goalResultHTML()}</div></section>`)}
function saveGoal(){state.goalUniv=document.getElementById('goalUniv').value;state.goalUnit=document.getElementById('goalUnit').value;state.myCourses=document.getElementById('myCourses').value.split(/[,，\n]/).map(x=>x.trim()).filter(Boolean);save();goalPage()}
function goalResultHTML(){if(!state.goalUnit)return '<div class="resultbox">목표 대학과 학과를 선택하면 비교 결과가 표시됩니다.</div>';let d=UNIVERSITY_DATA.find(x=>x.unit===state.goalUnit&&(!state.goalUniv||x.university===state.goalUniv));if(!d)return `<div class="resultbox"><h3>${esc(state.goalUniv||'대학 미정')} · ${esc(state.goalUnit)}</h3><p>선택한 대학의 자료에서 해당 학과·모집단위 권장과목을 찾지 못했습니다.</p><p class="muted-note">다른 대학의 동일하거나 비슷한 학과 자료를 대신 표시하지 않았습니다. 대학과 모집단위 선택을 다시 확인하거나, 최신 대학 자료를 별도로 확인하세요.</p></div>`;let req=[...String(d.core||'').split(/[,，\n]/),...String(d.recommended||'').split(/[,，\n]/)].map(x=>x.trim()).filter(x=>x&&x!=='-'&&!x.includes('과목 위계'));req=[...new Set(req)];let mine=state.myCourses||[];let matched=req.filter(x=>mine.some(m=>m===x||x.includes(m)||m.includes(x)));let missing=req.filter(x=>!matched.includes(x));return `<div class="resultbox"><h3>${esc(d?.university||state.goalUniv||'선택 대학')} · ${esc(state.goalUnit)}</h3><p>자료에서 확인한 관련 과목 ${req.length}개 중 현재 입력과 일치하는 과목은 ${matched.length}개입니다.</p><div class="progress"><span style="width:${req.length?matched.length/req.length*100:0}%"></span></div><div class="split"><div><b>입력한 과목과 일치</b><div class="chips">${matched.map(x=>`<span class="chip core">${esc(x)}</span>`).join('')||'<span class="muted">아직 일치 항목이 없습니다.</span>'}</div></div><div><b>확인할 과목</b><div class="chips">${missing.map(x=>`<span class="chip rec">${esc(x)}</span>`).join('')||'<span class="muted">자료 기준으로 추가 확인할 과목이 없습니다.</span>'}</div></div></div><p class="muted-note">이 비교는 입력한 과목명과 자료의 과목명을 단순 비교한 참고 결과입니다. 과목 위계, 학교 개설 여부, 실제 전형 반영 여부는 별도로 확인하세요.</p></div>`}
function weeklyPage(){pageShell('맞춤형 공부 계획','주간 공부 시간과 과목별 목표를 설정하고 완료 여부를 체크하세요.',`<section class="card"><div class="form-grid"><div class="field"><label>이번 주 목표 공부 시간 (시간)</label><input id="weekHours" type="number" min="0" max="100" value="${Number(state.weekHours||12)}"></div><div class="field"><label>과목별 목표 추가</label><input id="weekSubject" placeholder="예: 미적분Ⅰ - 문제 20개"></div></div><div class="btnrow"><button class="primary" onclick="saveWeekGoal()">목표 저장</button><button class="secondary" onclick="planner()">타이머 열기</button></div><div id="weekTasks">${weeklyTasksHTML()}</div><p class="muted-note">주간 목표는 스스로 조정할 수 있는 계획 예시입니다. 무리한 공부 시간보다 지속 가능한 계획을 우선하세요.</p></section>`)}
function saveWeekGoal(){state.weekHours=Math.max(0,Number(document.getElementById('weekHours').value)||0);let v=document.getElementById('weekSubject').value.trim();state.weekTasks=state.weekTasks||[];if(v)state.weekTasks.push({id:Date.now(),text:v,done:false});save();weeklyPage()}
function weeklyTasksHTML(){let a=state.weekTasks||[];return `<h3 style="margin-top:20px">이번 주 과목별 목표 (${a.filter(x=>x.done).length}/${a.length} 완료)</h3>${a.map(x=>`<div class="task"><label><input type="checkbox" ${x.done?'checked':''} onchange="toggleWeek(${x.id})"> ${esc(x.text)}</label><button class="secondary small" onclick="removeWeek(${x.id})">삭제</button></div>`).join('')||'<p class="muted">과목별 목표를 추가해 보세요.</p>'}<div class="resultbox">주간 목표: <b>${Number(state.weekHours||12)}시간</b></div>`}
function toggleWeek(id){let x=(state.weekTasks||[]).find(x=>x.id===id);if(x)x.done=!x.done;save();weeklyPage()}function removeWeek(id){state.weekTasks=(state.weekTasks||[]).filter(x=>x.id!==id);save();weeklyPage()}
const activityBank={

 '인문':[['탐구','같은 주제를 다룬 글 두 편의 관점과 표현 비교'],['독서','작품의 시대적 배경과 인물의 선택을 연결해 독서 기록 작성'],['동아리','교내 신문·글쓰기·독서 토론 활동'],['프로젝트','관심 주제의 인터뷰를 진행하고 내용을 주제별로 분류']],
 '보건·의약학':[['탐구','건강 관련 공공 자료를 찾아 출처와 통계 해석을 연습'],['독서','인체·보건·의료 윤리 관련 도서 읽기'],['동아리','건강 정보의 정확성을 검토하는 안내 자료 만들기'],['프로젝트','생활 습관과 건강 정보의 관계를 문헌 중심으로 조사']],
 '교육':[['탐구','학습 방법에 따른 기억·이해 차이를 문헌으로 조사'],['독서','교육·청소년 발달 관련 책 읽기'],['동아리','또래 학습 자료나 개념 설명 카드 제작'],['프로젝트','어려운 개념을 설명하는 짧은 학습 콘텐츠 제작']],
 '예술·체육':[['탐구','작품이나 경기 장면의 구성·기술 요소 분석'],['독서','창작 과정이나 스포츠 과학 관련 책 읽기'],['동아리','작품 제작·공연·스포츠 활동의 기록과 피드백'],['프로젝트','기획 의도와 제작 과정을 담은 포트폴리오 만들기']]
};
function activitiesPage(){let key=state.activityMajor||state.major||interestOptions.find(x=>x.name===state.interest)?.name||'공학';if(key==='자연')key='자연';if(!activityBank[key])key='공학';pageShell('진로 관련 활동 추천','선택한 계열을 바탕으로 학교에서 발전시킬 수 있는 활동 아이디어입니다.',`<section class="card"><div class="field"><label>관심 계열</label><select id="activityMajor" onchange="state.activityMajor=this.value;save();activitiesPage()">${interestOptions.map(o=>`<option ${key===o.name?'selected':''}>${o.name}</option>`).join('')}</select></div><div class="split" style="margin-top:16px">${(activityBank[state.activityMajor||key]||activityBank[key]).map(([type,text])=>`<div class="resultbox"><span class="chip">${type}</span><p>${text}</p><button class="secondary" onclick="saveActivity('${type}','${esc(text)}')">활동 아이디어 저장</button></div>`).join('')}</div><h3 style="margin-top:20px">저장한 활동 아이디어</h3>${(state.savedActivities||[]).map(x=>`<div class="saved-item"><b>${esc(x.type)}</b> · ${esc(x.text)}</div>`).join('')||'<p class="muted">아직 저장한 활동이 없습니다.</p>'}</section>`)}
function saveActivity(type,text){state.savedActivities=state.savedActivities||[];if(!state.savedActivities.some(x=>x.text===text))state.savedActivities.push({type,text});save();activitiesPage()}
function savedPage(){let d=state.savedDepts||[],i=state.savedInterests||[],a=state.savedActivities||[];pageShell('저장한 진로 정보','저장된 정보는 이 브라우저의 localStorage에 보관됩니다.',`<div class="split"><section class="card"><h3>기본 진로 설정</h3><p>학년: ${esc(state.grade||'미정')}학년</p><p>희망 진로: ${esc(state.career||'미정')}</p><p>계열: ${esc(state.major||'미정')}</p><p>관심 계열: ${esc(state.interestTrack?state.interestTrack.field+' › '+state.interestTrack.name:'미정')}</p><p>목표 대학: ${esc(state.goalUniv||state.university||'미정')}</p><p>목표 학과: ${esc(state.goalUnit||state.unit||'미정')}</p><p>적성 테스트: ${state.savedQuiz?'저장됨':'아직 저장하지 않음'}</p><button class="secondary" onclick="profile()">진로 설정 수정</button></section><section class="card"><h3>관심 분야</h3>${i.map(x=>`<div class="saved-item">${esc(x)}</div>`).join('')||'<p class="muted">저장한 관심 분야가 없습니다.</p>'}<h3>관심 학과</h3>${d.map(x=>`<div class="saved-item">${esc(x)}</div>`).join('')||'<p class="muted">저장한 학과가 없습니다.</p>'}<h3>활동 아이디어</h3>${a.map(x=>`<div class="saved-item">${esc(x.type)} · ${esc(x.text)}</div>`).join('')||'<p class="muted">저장한 활동이 없습니다.</p>'}</section></div><section class="card" style="margin-top:16px"><h3>데이터 관리</h3><p class="muted">진로 정보는 현재 사용 중인 브라우저에 저장됩니다. 다른 기기나 브라우저와 자동으로 동기화되지 않습니다.</p><button class="secondary" onclick="exportData()">내 진로 정보 내보내기</button></section>`)}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='진로정보_백업.json';a.click();URL.revokeObjectURL(url)}
function roadmapPage(){let g=Number(state.grade)||1;let stages=[['고1','관심 분야 넓게 탐색하기','교과별 흥미 기록, 진로·적성 테스트, 독서와 기초 탐구 경험'],['고2','과목 선택과 심화 활동 연결하기','희망 학과 권장과목 확인, 선택 과목 점검, 전공 관련 탐구·동아리·프로젝트'],['고3','대학·학과와 지원 준비 구체화하기','대학별 최신 모집요강 확인, 학업 기록 정리, 지원 일정과 학습 계획 점검']];pageShell('진로 로드맵','학년별로 과목 선택 → 진로 활동 → 학업 계획 → 대학 준비를 연결합니다.',`<section class="card"><div class="roadmap">${stages.map((s,i)=>`<div class="roadstep"><span class="chip ${g===i+1?'core':''}">${s[0]} ${g===i+1?'· 현재 학년':''}</span><h3>${s[1]}</h3><p>${s[2]}</p><div class="checkline"><input type="checkbox" ${state.roadmapDone?.[i]?'checked':''} onchange="toggleRoadmap(${i})"><label>이 단계 확인 완료</label></div></div>`).join('')}</div><h3 style="margin-top:22px">나의 다음 행동</h3><div class="resultbox">${g===1?'관심 분야를 두세 가지 비교하고, 여러 과목의 수업 경험과 흥미를 기록해 보세요.':g===2?'관심 학과의 권장과목과 학교 개설 과목을 비교하고, 수업에서 배운 개념을 탐구 활동으로 발전시켜 보세요.':'희망 대학의 공식 모집요강과 전형 일정을 확인하고, 현재 학업 상황에 맞는 계획을 세워 보세요.'}</div><p class="muted-note">이 로드맵은 일반적인 참고 흐름입니다. 학교 일정과 개인 상황에 맞게 조정하세요.</p></section>`)}

var admState={q:'',season:'전체',type:'전체',area:'전체',open:{}};
function admNorm(t){return String(t||'').replace(/\s+/g,'').toLowerCase()}
function admUnits(a){return UNIVERSITY_DATA.filter(x=>(a.m||[]).includes(x.university)).map(x=>x.unit)}
function admSearch(){
 const toks=admState.q.trim().split(/\s+/).filter(Boolean).map(admNorm).filter(t=>!['수능최저','수능최저학력기준','전형'].includes(t));
 const out=[];
 ADMISSION_DATA.forEach((a,idx)=>{
  const head=admNorm(a.u+a.k+a.a);
  const units=admUnits(a);
  let rest=[],matchedUnits=new Set();
  toks.forEach(t=>{
   const st=t.replace(/(공학부|공학과|학과|학부|공학|과)$/,'');
   const us=units.filter(u=>{const n=admNorm(u);return n.includes(t)||(st.length>=2&&n.includes(st))});
   const hm=head.includes(t);
   us.forEach(u=>matchedUnits.add(u));
   if(!hm&&!us.length)rest.push(t);
  });
  let items=a.items.filter(it=>(admState.season==='전체'||it[0]===admState.season)&&(admState.type==='전체'||it[2]===admState.type));
  if(rest.length)items=items.filter(it=>{const h=admNorm(it.join(' '));return rest.every(t=>(t==='없음'||t==='미적용'||t==='불필요')?/없음|미적용|적용하지않음/.test(h):h.includes(t))});
  if(admState.area!=='전체'&&a.a!==admState.area)return;
  if(!items.length)return;
  out.push({a,idx,items,units:[...matchedUnits]});
 });
 return out;
}
function admRender(){
 const r=admSearch(),box=document.getElementById('admResults');if(!box)return;
 const total=r.reduce((s,x)=>s+x.items.length,0);
 const openAll=r.length<=3;
 box.innerHTML=`<p class="muted" style="margin:12px 0">검색 결과: 대학 ${r.length}곳 · 전형 ${total}개</p>`+
 (r.map(x=>{const a=x.a,isOpen=admState.open[x.idx]!==undefined?admState.open[x.idx]:openAll;
  return `<div class="card adm-card" style="margin-bottom:12px"><div class="adm-head"><div><strong style="font-size:17px">${esc(a.u)}</strong> <span class="chip">${esc(a.a)}</span></div><button class="secondary small" onclick="admToggle(${x.idx},${isOpen?'false':'true'})">${isOpen?'접기':'전형 보기'} (${x.items.length})</button></div><div class="muted" style="font-size:13px;margin-top:4px">${esc(a.tot)}</div>${x.units.length?`<div class="chips" style="margin-top:8px">${x.units.slice(0,8).map(u=>`<span class="chip core">${esc(u)}</span>`).join('')}</div><div class="muted" style="font-size:12px;margin-top:4px">검색한 학과가 앱의 대학별 권장과목 자료에 있는 대학입니다. 학과별 모집인원·지원 가능 전형은 모집요강에서 확인하세요.</div>`:''}${isOpen?`<div class="adm-wrap"><table class="adm-table"><thead><tr><th>시기</th><th>전형명</th><th>유형</th><th>모집인원</th><th>전형요소·반영비율</th><th>수능최저학력기준</th></tr></thead><tbody>${x.items.map(it=>`<tr><td>${esc(it[0])}</td><td><b>${esc(it[1])}</b></td><td>${esc(it[2])}</td><td>${esc(it[3])}</td><td>${esc(it[4])}</td><td>${esc(it[5])}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`}).join('')||'<div class="empty">조건에 맞는 대학·전형이 없습니다. 검색어를 줄이거나 필터를 바꿔 보세요.</div>');
}

function admSet(k,v){admState[k]=v;admPage(null,true)}
function admInput(){admState.q=document.getElementById('admQ').value;admState.open={};admRender()}
function admChips(k,list){return `<div class="chips" style="margin-top:8px"><span class="muted" style="align-self:center;font-size:13px;min-width:44px">${k==='season'?'시기':k==='type'?'유형':'지역'}</span>${list.map(v=>`<button class="chip adm-chip${admState[k]===v?' on':''}" onclick="admSet('${k}','${v}')">${v}</button>`).join('')}</div>`}
function admPage(prefill,keep){
 if(prefill!==null&&prefill!==undefined&&!keep){admState.q=prefill;admState.open={}}
 const areas=['전체',...[...new Set(ADMISSION_DATA.map(a=>a.a))]];
 pageShell('입학 전형 검색','2028학년도 대학입학전형시행계획 기준으로 정리한 30개 대학의 수시·정시 전형입니다. 대학명, 학과명, 전형명으로 검색해 보세요.',`<section class="card"><div class="planner-row"><input id="admQ" class="field" style="padding:12px;border:1px solid #dfe4ed;border-radius:12px;flex:1" value="${esc(admState.q)}" placeholder="예: 서울대, 기계공학, 논술, 지역균형, 수능최저 없음" oninput="admInput()"><button class="primary" onclick="admInput()">검색</button></div>${admChips('season',['전체','수시','정시'])}${admChips('type',['전체','학생부교과','학생부종합','논술','실기','수능'])}${admChips('area',areas)}<p class="footer-note">모집인원은 시행계획에 실린 정원 내·외 수치이며, 캠퍼스가 합쳐진 문서는 대학명 옆에 기준을 적었습니다. 시행계획 이후 변경될 수 있으므로 지원 전에 반드시 해당 대학의 모집요강을 확인하세요. 시행계획 파일을 읽지 못한 대학(경희대·이화여대·동국대·경북대·전남대·전북대·조선대·인하대)은 포함하지 않았습니다.</p></section><div id="admResults"></div>`);
 admRender();
}

start();

</script>
</body>
</html>
